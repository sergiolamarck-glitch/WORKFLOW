    // GUIA VISUAL ETAPA 2: Roteamento de Barramentos
    function VisualGuideStep2() {
      const [isLong, setIsLong] = useState(true);
      const [isHvac, setIsHvac] = useState(false);

      let selectedCode = "486 + HOLD";
      let codeColor = "bg-rose-100 text-rose-700 border-rose-300";
      
      if (isLong) {
        if (isHvac) {
          selectedCode = "E45 (HVAC)";
          codeColor = "bg-cyan-100 text-cyan-800 border-cyan-300";
        } else {
          selectedCode = "E97 (STANDARD)";
          codeColor = "bg-amber-100 text-amber-800 border-amber-300";
        }
      }

      return (
        <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-4">
          <div className="flex items-center justify-between border-b border-slate-200 pb-3">
            <span className="text-xs font-bold uppercase tracking-wider text-amber-600 flex items-center gap-1.5">
              <IconRuler className="w-4 h-4" /> Fluxograma Decisório de Barramentos
            </span>
            <span className="text-[11px] bg-amber-100 text-amber-800 font-semibold px-2.5 py-0.5 rounded-full">
              Poka-Yoke de Traçado
            </span>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            {/* Opções de Seleção */}
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
              <span className="text-xs font-bold text-slate-700 block border-b pb-1">1. Condição da Linha</span>
              
              <label className="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
                <input 
                  type="checkbox" 
                  checked={isLong} 
                  onChange={(e) => setIsLong(e.target.checked)}
                  className="w-4 h-4 text-amber-600 rounded focus:ring-amber-500"
                />
                É Barramento Longo?
              </label>

              <label className={`flex items-center gap-2 cursor-pointer text-xs font-medium ${!isLong ? 'opacity-40 pointer-events-none' : 'text-slate-700'}`}>
                <input 
                  type="checkbox" 
                  checked={isHvac} 
                  disabled={!isLong}
                  onChange={(e) => setIsHvac(e.target.checked)}
                  className="w-4 h-4 text-cyan-600 rounded focus:ring-cyan-500"
                />
                Aplicação HVAC?
              </label>
            </div>

            {/* Ilustração Visual da Linha */}

            <div className="bg-white p-2 rounded-lg border border-slate-200 flex items-center gap-2">
              <span className="font-bold text-purple-600 bg-purple-50 px-1 rounded">EA</span>
              <span>Símbolo do EA</span>
            </div>
            <div className="bg-white p-2 rounded-lg border border-slate-200 flex items-center gap-2">
              <span className="font-bold text-emerald-600 bg-emerald-50 px-1 rounded">LUG</span>
              <span>Símbolo do LUG</span>
            </div>
          </div>
        </div>
      );
    }

    // GUIA VISUAL ETAPA 4: Hierarquia de Tags
    function VisualGuideStep4() {
      return (
        <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-4">
          <div className="flex items-center justify-between border-b border-slate-200 pb-3">
            <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 flex items-center gap-1.5">
              <IconTag className="w-4 h-4" /> Pilha Hierárquica de TAGs (Inviolável)
            </span>
            <span className="text-[11px] bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full">
              Sequência 1 a 4
            </span>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
            {[
              { num: '1', title: 'Aterramentos', color: 'bg-emerald-500 text-white', border: 'border-emerald-600' },
              { num: '2', title: 'Jumpers', color: 'bg-indigo-500 text-white', border: 'border-indigo-600' },
              { num: '3', title: 'Derivações', color: 'bg-amber-500 text-white', border: 'border-amber-600' },
              { num: '4', title: 'Main Cable', color: 'bg-slate-700 text-white', border: 'border-slate-800' }
            ].map((item, idx) => (
              <div key={item.num} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                <span className={`w-8 h-8 rounded-lg ${item.color} font-mono font-bold flex items-center justify-center text-sm shadow-sm`}>
                  {item.num}º
                </span>
                <div>
                  <strong className="text-xs text-slate-800 block">{item.title}</strong>
                  <span className="text-[10px] text-slate-400">Prioridade {idx + 1}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // GUIA VISUAL ETAPA 5: Diagrama Terminal 697 & Busbar
    function VisualGuideStep5() {
      const [activeNode, setActiveNode] = useState('697');

      const nodeDetails = {
        '697': { title: 'Terminal 697 (Busbar Principal)', desc: 'Ponto central de aterramento. Exige a Tabela AZAXX no desenho.', code: 'AZAXX' },
        'E54X-02': { title: 'Cabo / Sufixo E54X-02', desc: 'Roteamento principal de conexão ao Busbar de aterramento.', code: '654X-02' },
        '610B': { title: 'Ponto Intermediário 610B / E54X-D1/02', desc: 'Derivação de aterramento secundário para bandejas e calhas.', code: 'E54X-D1/02' },
        '655-D3': { title: 'Terminal 655-D3 (Main & Jumpers)', desc: 'Conexão final de jumper de segurança para instrumentos.', code: 'E54A-01/02' }
      };

      const current = nodeDetails[activeNode];

      return (
        <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-4">
          <div className="flex items-center justify-between border-b border-slate-200 pb-3">
            <span className="text-xs font-bold uppercase tracking-wider text-rose-600 flex items-center gap-1.5">
              <IconZap className="w-4 h-4" /> Mapa Esquemático Aterramento INS/TELE
            </span>
            <span className="text-[11px] bg-rose-100 text-rose-800 font-semibold px-2.5 py-0.5 rounded-full">
              Terminal 697 & Busbar
            </span>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {/* Seletor do Diagrama Esquematizado */}
            <div className="md:col-span-2 bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
              <span className="text-xs font-semibold text-slate-500 block">Clique nos pontos do circuito para inspecionar:</span>
              
              <div className="flex flex-wrap items-center justify-center gap-3 py-4 bg-slate-100 rounded-xl border border-dashed border-slate-300">
                <button 
                  onClick={() => setActiveNode('697')}
                  className={`px-3 py-2 rounded-lg font-mono text-xs font-bold transition-all shadow-sm ${activeNode === '697' ? 'bg-rose-600 text-white ring-2 ring-rose-400' : 'bg-white text-slate-700 border border-slate-300'}`}
                >
                  [697] BUSBAR
                </button>
                <span className="text-slate-400 font-bold">➔</span>
                <button 
                  onClick={() => setActiveNode('E54X-02')}
                  className={`px-3 py-2 rounded-lg font-mono text-xs font-bold transition-all shadow-sm ${activeNode === 'E54X-02' ? 'bg-rose-600 text-white ring-2 ring-rose-400' : 'bg-white text-slate-700 border border-slate-300'}`}
                >
                  E54X-02
                </button>
                <span className="text-slate-400 font-bold">➔</span>
                <button 
                  onClick={() => setActiveNode('610B')}
                  className={`px-3 py-2 rounded-lg font-mono text-xs font-bold transition-all shadow-sm ${activeNode === '610B' ? 'bg-rose-600 text-white ring-2 ring-rose-400' : 'bg-white text-slate-700 border border-slate-300'}`}
                >
                  610B / Derivação
                </button>
                <span className="text-slate-400 font-bold">➔</span>
                <button 
                  onClick={() => setActiveNode('655-D3')}
                  className={`px-3 py-2 rounded-lg font-mono text-xs font-bold transition-all shadow-sm ${activeNode === '655-D3' ? 'bg-rose-600 text-white ring-2 ring-rose-400' : 'bg-white text-slate-700 border border-slate-300'}`}
                >
                  655-D3 / Jumper
                </button>
              </div>
            </div>

            {/* Painel de Detalhes do Nó */}
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-2">
              <div>
                <span className="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-100">
                  REF. MANUSCRITO
                </span>
                <h4 className="font-bold text-sm text-slate-800 mt-2">{current.title}</h4>
                <p className="text-xs text-slate-500 mt-1">{current.desc}</p>
              </div>

              <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-center">
                <span className="text-[10px] text-slate-400 block">Código na Tabela</span>
                <code className="text-xs font-bold text-indigo-600">{current.code}</code>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPONENTE PRINCIPAL (APP) ---
    function App() {
      const [activeTab, setActiveTab] = useState('workflow'); // 'workflow' | 'fmea' | 'checklist'
      const [selectedStage, setSelectedStage] = useState(STAGES_DATA[0].id);
      const [searchTerm, setSearchTerm] = useState('');
      
      // Estado de Checkbox com persistência LocalStorage
      const [checkedItems, setCheckedItems] = useState(() => {
        try {
          const saved = localStorage.getItem('quality_checklist_state');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('quality_checklist_state', JSON.stringify(checkedItems));
        } catch (e) {}
      }, [checkedItems]);

      const allChecklistItems = useMemo(() => {
        return STAGES_DATA.flatMap(stage => 
          stage.fmeaItems.map(item => ({
            ...item,
            stageId: stage.id,
            stageTitle: stage.title,
            stageNumber: stage.number,
            rpn: item.severity * item.occurrence * item.detection
          }))
        );
      }, []);

      const toggleCheck = (id) => {
        setCheckedItems(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const completedCount = useMemo(() => {
        return Object.values(checkedItems).filter(Boolean).length;
      }, [checkedItems]);

      const progressPercentage = Math.round((completedCount / allChecklistItems.length) * 100);

      const currentStageObj = STAGES_DATA.find(s => s.id === selectedStage);

      // Renderizador de Guias Visuais por Etapa
      const renderVisualGuide = (stageId) => {
        switch (stageId) {
          case 'sheet-prep': return <VisualGuideStep1 />;
          case 'drawing-trace': return <VisualGuideStep2 />;
          case 'tables-data': return <VisualGuideStep3 />;
          case 'tagging-cables': return <VisualGuideStep4 />;
          case 'grounding-busbar': return <VisualGuideStep5 />;
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 pb-16 font-sans">
          
          {/* HEADER FIXO - APPLE / GOOGLE PIXEL STYLE */}
          <header className="glass-nav border-b border-slate-200/80 sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
              
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20">
                  <IconShield className="w-6 h-6 stroke-[2.2]" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 border border-blue-200 uppercase tracking-wider">
                      Zero-Defect Quality
                    </span>
                    <span className="text-[11px] text-slate-400">PDF Workflow Integrado</span>
                  </div>
                  <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight">
                    Workflow Visual de Mitigação de Erros
                  </h1>
                </div>
              </div>

              {/* INDICADOR DE CONFORMIDADE */}
              <div className="flex items-center gap-3">
                <div className="bg-white border border-slate-200 rounded-2xl px-3.5 py-1.5 shadow-sm text-right">
                  <span className="text-[10px] text-slate-400 uppercase tracking-wider block font-semibold">Progresso da Inspeção</span>
                  <span className={`text-xs font-bold flex items-center justify-end gap-1 ${progressPercentage === 100 ? 'text-emerald-600' : 'text-blue-600'}`}>
                    <IconSparkles className="w-3.5 h-3.5" />
                    {completedCount} de {allChecklistItems.length} Verificados ({progressPercentage}%)
                  </span>
                </div>
              </div>

            </div>

            {/* ABAS DE NAVEGAÇÃO PRINCIPAIS */}
            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex space-x-2 pt-2 border-t border-slate-100">
              {[
                { id: 'workflow', label: 'Workflow & Guias Visuais', icon: IconLayers },
                { id: 'fmea', label: 'Matriz FMEA de Riscos', icon: IconAlert },
                { id: 'checklist', label: 'Checklist de Auditoria', icon: IconCheck }
              ].map((tab) => {
                const IconComp = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-xl transition-all ${
                      isActive 
                        ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' 
                        : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                    }`}
                  >
                    <IconComp className="w-4 h-4" />
                    {tab.label}
                  </button>
                );
              })}
            </div>
          </header>

          {/* CONTEÚDO */}
          <main className="max-w-6xl mx-auto px-4 sm:px-6 mt-6">
            
            {/* ABA 1: WORKFLOW VISUAL & GUIAS INTERATIVOS */}
            {activeTab === 'workflow' && (
              <div className="space-y-6">
                
                {/* BARRA DE NÓS DO FLUXO (PIPELINE) */}
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                  {STAGES_DATA.map((stage) => {
                    const isSelected = selectedStage === stage.id;
                    const stageItems = allChecklistItems.filter(i => i.stageId === stage.id);
                    const isDone = stageItems.length > 0 && stageItems.every(i => checkedItems[i.id]);

                    return (
                      <button
                        key={stage.id}
                        onClick={() => setSelectedStage(stage.id)}
                        className={`p-3.5 rounded-2xl border text-left transition-all relative overflow-hidden flex flex-col justify-between h-28 ${
                          isSelected 
                            ? 'bg-white border-blue-500 ring-2 ring-blue-500/20 shadow-lg shadow-blue-500/5' 
                            : 'bg-white/80 border-slate-200 hover:border-slate-300 hover:bg-white'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${stage.colorBadge}`}>
                            {stage.number}
                          </span>
                          {isDone ? (
                            <span className="text-emerald-500 bg-emerald-50 p-1 rounded-full border border-emerald-200">
                              <IconCheck className="w-3.5 h-3.5" />
                            </span>
                          ) : (
                            <span className="text-slate-300">•</span>
                          )}
                        </div>

                        <div>
                          <h3 className="text-xs font-bold text-slate-800 line-clamp-1">{stage.title}</h3>
                          <p className="text-[10px] text-slate-400 line-clamp-1">{stage.subtitle}</p>
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* DETALHAMENTO DA ETAPA ATIVA */}
                {currentStageObj && (
                  <div className="bg-white border border-slate-200/90 rounded-3xl p-6 shadow-sm space-y-6">
                    
                    {/* CABEÇALHO DA ETAPA */}
                    <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                      <div className="flex items-center gap-3">
                        <div className={`p-3 rounded-2xl border ${currentStageObj.colorBg}`}>
                          <currentStageObj.icon className="w-6 h-6" />
                        </div>
                        <div>
                          <span className="text-[10px] font-extrabold uppercase text-slate-400 tracking-wider">
                            ETAPA {currentStageObj.number}
                          </span>
                          <h2 className="text-lg font-bold text-slate-900">{currentStageObj.title}</h2>
                        </div>
                      </div>
                      <span className="text-xs text-slate-500 bg-slate-100 px-3 py-1 rounded-full font-medium">
                        {currentStageObj.fmeaItems.length} Pontos de Controle
                      </span>
                    </div>

                    {/* GUIA VISUAL EXCLUSIVO DA ETAPA */}
                    {renderVisualGuide(currentStageObj.id)}

                    {/* REGRAS & CONTROLES POKA-YOKE DA ETAPA */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      {currentStageObj.fmeaItems.map((item) => {
                        const isChecked = !!checkedItems[item.id];
                        const rpn = item.severity * item.occurrence * item.detection;

                        return (
                          <div 
                            key={item.id}
                            className={`p-4 rounded-2xl border transition-all ${
                              isChecked 
                                ? 'bg-emerald-50/50 border-emerald-200' 
                                : 'bg-white border-slate-200 hover:border-slate-300'
                            }`}
                          >
                            <div className="flex items-start justify-between gap-2">
                              <div className="flex items-center gap-2.5">
                                <button
                                  onClick={() => toggleCheck(item.id)}
                                  className={`w-6 h-6 rounded-lg border flex items-center justify-center transition-all ${
                                    isChecked 
                                      ? 'bg-emerald-600 border-emerald-600 text-white' 
                                      : 'bg-white border-slate-300 hover:border-slate-400 text-transparent'
                                  }`}
                                >
                                  <IconCheck className="w-4 h-4 stroke-[3]" />
                                </button>
                                <h4 className="text-sm font-bold text-slate-800">{item.element}</h4>
                              </div>

                              <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded-full ${
                                rpn > 100 ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'
                              }`}>
                                RPN {rpn}
                              </span>
                            </div>

                            {/* REGRA MANUSCRITA */}
                            <div className="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-200/60">
                              <span className="text-[10px] font-bold uppercase text-slate-400 block mb-0.5">Regra do Manuscrito (PDF)</span>
                              <p className="text-xs text-slate-700 font-medium">{item.ruleText}</p>
                            </div>

                            {/* POKA YOKE */}
                            <div className="mt-2.5 flex items-start gap-2 text-xs text-emerald-800 bg-emerald-100/60 p-2.5 rounded-xl border border-emerald-200/50">
                              <IconShield className="w-4 h-4 shrink-0 mt-0.5 text-emerald-600" />
                              <div>
                                <strong className="font-bold block text-emerald-900">Trava Poka-Yoke:</strong>
                                {item.pokaYoke}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                  </div>
                )}
              </div>
            )}

            {/* ABA 2: MATRIZ FMEA */}
            {activeTab === 'fmea' && (
              <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                  <div>
                    <h2 className="text-base font-bold text-slate-900">Matriz FMEA (Análise de Erros e Falhas)</h2>
                    <p className="text-xs text-slate-500">Cálculo de RPN = Severidade (S) × Ocorrência (O) × Detecção (D)</p>
                  </div>

                  <div className="relative w-full sm:w-64">
                    <IconSearch className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input
                      type="text"
                      placeholder="Buscar regra ou falha..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-1.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 text-slate-500 uppercase font-semibold border-b border-slate-200">
                      <tr>
                        <th className="p-3">Etapa / Elemento</th>
                        <th className="p-3">Modo de Falha</th>
                        <th className="p-3 text-center">S</th>
                        <th className="p-3 text-center">O</th>
                        <th className="p-3 text-center">D</th>
                        <th className="p-3 text-center">RPN</th>
                        <th className="p-3">Trava Poka-Yoke</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {allChecklistItems
                        .filter(i => i.element.toLowerCase().includes(searchTerm.toLowerCase()) || i.ruleText.toLowerCase().includes(searchTerm.toLowerCase()))
                        .map((item) => (
                          <tr key={item.id} className="hover:bg-slate-50/80">
                            <td className="p-3">
                              <span className="text-[10px] text-blue-600 font-bold block">ETAPA {item.stageNumber}</span>
                              <strong className="text-slate-800">{item.element}</strong>
                            </td>
                            <td className="p-3 text-slate-600 max-w-xs">{item.failureMode}</td>
                            <td className="p-3 text-center font-mono">{item.severity}</td>
                            <td className="p-3 text-center font-mono">{item.occurrence}</td>
                            <td className="p-3 text-center font-mono">{item.detection}</td>
                            <td className="p-3 text-center font-mono">
                              <span className={`px-2 py-0.5 rounded-full font-bold ${item.rpn > 100 ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-700'}`}>
                                {item.rpn}
                              </span>
                            </td>
                            <td className="p-3 max-w-xs text-emerald-700 font-medium">{item.pokaYoke}</td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ABA 3: CHECKLIST DE AUDITORIA */}
            {activeTab === 'checklist' && (
              <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-6">
                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                  <div>
                    <h2 className="text-base font-bold text-slate-900">Checklist Digital de Inspeção</h2>
                    <p className="text-xs text-slate-500">Marque os itens conforme realiza a conferência da folha de desenho.</p>
                  </div>
                  <button
                    onClick={() => setCheckedItems({})}
                    className="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl font-medium transition-colors"
                  >
                    <IconRefresh className="w-3.5 h-3.5" /> Resetar
                  </button>
                </div>

                <div className="space-y-3">
                  {allChecklistItems.map((item) => {
                    const isChecked = !!checkedItems[item.id];
                    return (
                      <div 
                        key={item.id}
                        onClick={() => toggleCheck(item.id)}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-start gap-3 ${
                          isChecked ? 'bg-emerald-50/60 border-emerald-200' : 'bg-slate-50/50 border-slate-200 hover:border-slate-300'
                        }`}
                      >
                        <div className={`w-6 h-6 rounded-lg border flex items-center justify-center shrink-0 mt-0.5 transition-all ${
                          isChecked ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white border-slate-300 text-transparent'
                        }`}>
                          <IconCheck className="w-4 h-4 stroke-[3]" />
                        </div>
                        <div className="flex-1">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-slate-800">{item.element}</span>
                            <span className="text-[10px] text-slate-400 font-mono">ETAPA {item.stageNumber}</span>
                          </div>
                          <p className="text-xs text-slate-600 mt-1">{item.ruleText}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </main>

        </div>
      );
    }

    // Renderizar App React no DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
