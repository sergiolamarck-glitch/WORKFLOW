        const list = [];
        STAGES_DATA.forEach(stage => {
          stage.fmeaItems.forEach(item => {
            list.push({
              id: item.id,
              stageId: stage.id,
              stageTitle: stage.title,
              element: item.element,
              ruleText: item.ruleText,
              pokaYoke: item.pokaYoke,
              rpn: item.severity * item.occurrence * item.detection
            });
          });
        });
        return list;
      }, []);

      const toggleCheck = (id) => {
        setCheckedItems(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const completedCount = React.useMemo(() => {
        return Object.values(checkedItems).filter(Boolean).length;
      }, [checkedItems]);

      const progressPercentage = Math.round((completedCount / allChecklistItems.length) * 100);

        return STAGES_DATA.flatMap(stage => 
          stage.fmeaItems.map(item => ({
            ...item,
            stageTitle: stage.title,
            stageNumber: stage.number,
            rpn: item.severity * item.occurrence * item.detection
          }))

          const matchesSearch = item.element.toLowerCase().includes(searchTerm.toLowerCase()) ||

                                item.pokaYoke.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesRpn = item.rpn >= minRpnFilter;
          return matchesSearch && matchesRpn;
        });
      }, [searchTerm, minRpnFilter]);

                          <span className="text-xs text-slate-400 font-mono">
                            {stageCheckedCount} / {stageItems.length} Verificados
                          </span>
                        </div>

                        <div className="divide-y divide-slate-800/60 p-2">
                          {stageItems.map((item) => {
                            const isChecked = !!checkedItems[item.id];
                            return (
                              <div 
                                key={item.id}
                                onClick={() => toggleCheck(item.id)}
                                className={`p-4 rounded-xl flex items-start gap-4 cursor-pointer transition-all ${
                                  isChecked 
                                    ? 'bg-emerald-950/20 text-slate-200' 
                                    : 'hover:bg-slate-800/40 text-slate-300'
                                }`}
                              >
                                <div className={`mt-0.5 p-1 rounded-md border transition-all ${
                                  isChecked 
                                    ? 'bg-emerald-500 border-emerald-400 text-slate-950' 
                                    : 'bg-slate-950 border-slate-700 text-transparent'
                                }`}>
                                  <Check className="w-4 h-4 stroke-[3]" />
                                </div>

                                <div className="flex-1 space-y-1">
                                  <div className="flex items-center justify-between gap-2">
                                    <span className="font-bold text-sm text-slate-100">{item.element}</span>
                                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">
                                      RPN {item.rpn}
                                    </span>
                                  </div>
                                  <p className="text-xs text-slate-300 font-mono bg-slate-950/60 p-2 rounded-lg border border-slate-800">
                                    {item.ruleText}
                                  </p>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {}
            {activeTab === 'rules' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Award className="w-5 h-5 text-rose-400" />
                    Símbolos e Tabela de Aterramento INS/TELE (PDF De-Para)
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    Consulta rápida dos códigos de aterramento e terminal 697 mapeados na folha manuscrita.
                  </p>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                  <div className="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                    <span className="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <Zap className="w-4 h-4 text-rose-400" /> Mapeamento de Códigos INS/TELE
                    </span>
                    <span className="text-xs font-mono text-indigo-400">Tabela AZAXX (Terminal 697)</span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-950 text-slate-400 font-semibold border-b border-slate-800 uppercase tracking-wider text-[10px]">
                        <tr>
                          <th className="p-4">Elemento / Conexão</th>
                          <th className="p-4">Código / Sufixo Técnico</th>
                          <th className="p-4">Tipo de Aplicação</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 text-slate-300 font-mono">
                        {GROUNDING_REF_TABLE.map((row, index) => (
                          <tr key={index} className="hover:bg-slate-800/30 transition-colors">
                            <td className="p-4 font-bold text-slate-200">{row.item}</td>
                            <td className="p-4 text-rose-400 font-bold">{row.codigo}</td>
                            <td className="p-4 text-slate-400 text-xs font-sans">{row.tipo}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>

          {}
          <footer className="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
            <p>Workflow Visual Interativo para Mitigação de Erros • Engenharia de Qualidade & Detalhamento Técnico ISO</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
